name: Run Production Filter

on:
  workflow_dispatch:  # Manual trigger only
  push:
    branches: [ main, master ]
    paths:
      - 'matches_today.csv'  # Auto-run when CSV is updated

jobs:
  production-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pandas requests openpyxl
    
    - name: List files for debug
      run: |
        echo "========================================="
        echo "Current directory:"
        pwd
        echo ""
        echo "CSV files:"
        ls -la *.csv 2>/dev/null || echo "No CSV files!"
        echo ""
        echo "All Python files:"
        ls -la *.py
        echo "========================================="
    
    - name: Show CSV content
      run: |
        if [ -f "matches_today.csv" ]; then
          echo "✅ matches_today.csv found!"
          echo ""
          echo "First 5 lines:"
          head -5 matches_today.csv
          echo ""
          echo "Total rows: $(wc -l < matches_today.csv)"
        else
          echo "❌ matches_today.csv NOT FOUND!"
          exit 1
        fi
    
    - name: Run production script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python run_production.py
    
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: production-results
        path: |
          filtered_results.csv
          top_20_picks.csv
          *.log
        retention-days: 7
