name: Process Pasted Match Data

on:
  # Runs automatically when you update input/matches_today.csv
  push:
    paths:
      - 'input/matches_today.csv'
      - 'input/**'
  
  # Also runs daily at 9 AM as backup
  schedule:
    - cron: '0 9 * * *'
  
  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  process-matches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Check if input file exists
        run: |
          if [ -f "input/matches_today.csv" ]; then
            echo "✅ Input file found"
            cat input/matches_today.csv | head -5
          else
            echo "❌ No input file found. Creating template..."
            mkdir -p input
            echo "league,home_team,away_team,home_odds,draw_odds,away_odds,time,date" > input/matches_today.csv
            echo "Premier League,Manchester City,Southampton,1.25,5.50,11.00,15:00,$(date +%Y-%m-%d)" >> input/matches_today.csv
          fi
      
      - name: Run blueprint processor
        run: |
          python manual_data_processor.py
      
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_bot.py || echo "Telegram notification skipped (no credentials)"
      
      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-results
          path: |
            output/
          retention-days: 30
      
      - name: Commit output files back to repository (optional)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/ || true
          git diff --staged --quiet || git commit -m "Auto-update blueprint results [skip ci]"
          git push || true
