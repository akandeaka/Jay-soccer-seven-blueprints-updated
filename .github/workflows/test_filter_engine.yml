name: Test Filter Engine

on:
  push:
    branches: [ main, master, test/filter-engine ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pandas
        pip install requests  # ← ADD THIS LINE
    
    - name: List files (debug)
      run: |
        echo "=== Root directory ==="
        ls -la
        echo ""
        echo "=== filter_engine directory ==="
        ls -la filter_engine/
    
    - name: Run test script
      run: python test_filter_engine.py
    
    - name: Run main bot
      run: python run_filtered_bot.py
    
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs
        path: |
          *.csv
          *.log
