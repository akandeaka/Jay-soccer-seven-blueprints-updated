name: Daily Soccer Predictions & Validation

on:
  schedule:
    - cron: '0 10 * * *'   # Predictions at 10 AM
    - cron: '0 1 * * *'    # Validation at 1 AM
  workflow_dispatch:

jobs:
  # Job 1: Run predictions at 10 AM
  run-predictions:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests pandas python-dotenv beautifulsoup4 numpy
    
    - name: Delete cache
      run: |
        rm -f predictions.json
        echo "✅ Cache deleted"
    
    - name: Run prediction system
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
    
    - name: Save predictions
      uses: actions/upload-artifact@v4
      with:
        name: predictions
        path: predictions.json

  # Job 2: Run validation at 1 AM
  run-validation:
    runs-on: ubuntu-latest
    needs: run-predictions
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests pandas python-dotenv beautifulsoup4 numpy
    
    - name: Download predictions
      uses: actions/download-artifact@v4
      with:
        name: predictions
        path: ./
      continue-on-error: true
    
    - name: Run validation
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python validate_from_file.py
    
    - name: Upload validation report
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: validation_report.md
        
