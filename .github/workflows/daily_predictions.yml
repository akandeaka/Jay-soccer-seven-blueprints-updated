name: Daily Soccer Predictions & Validation

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  # Job 1: Run predictions at 10 AM
  run-predictions:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run prediction system
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
    
    - name: Save predictions
      uses: actions/upload-artifact@v4
      with:
        name: predictions
        path: predictions.json

  # Job 2: Run validation at 1 AM
  run-validation:
    runs-on: ubuntu-latest
    needs: run-predictions
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Debug - Check if API key is available
      run: |
        if [ -n "$FOOTBALL_DATA_API_KEY" ]; then
          echo "✅ FOOTBALL_DATA_API_KEY is set"
        else
          echo "❌ FOOTBALL_DATA_API_KEY is NOT set"
        fi
      env:
        FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    
    - name: Download predictions
      uses: actions/download-artifact@v4
      with:
        name: predictions
        path: ./
    
    - name: Run validation
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      run: |
        python run_validation.py
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: |
          performance_report.md
          prediction_history.json
