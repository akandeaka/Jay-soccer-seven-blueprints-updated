    - name: Record results into prediction history
      run: python record_results.py

    - name: Commit updated history
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add prediction_history.json || true
        git commit -m "Automated: settle predictions" || true
        git push || true
