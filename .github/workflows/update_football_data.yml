name: Update Football Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update data
        run: |
          pip install pandas requests
          python update_football_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git add data/
          git commit -m "Auto-update football data [skip ci]" || exit 0
          git push
