name: Run Production

on:
  workflow_dispatch:  # Manual trigger only
  push:
    branches: [ main, master ]
    paths:
      - 'matches_today.csv'

jobs:
  production:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install pandas requests openpyxl
    
    - name: Verify CSV exists
      run: |
        if [ -f "matches_today.csv" ]; then
          echo "✅ CSV found"
          head -5 matches_today.csv
        else
          echo "❌ CSV NOT found!"
          exit 1
        fi
    
    - name: Run production
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python run_production.py
    
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: production-results
        path: |
          filtered_results.csv
          top_20_picks.csv
          *.log
